# ==============================================================================
# C2G-Bench — Master Environment Configuration
# ==============================================================================
# This is the single source of truth for all simulation parameters.
# Loaded by C2GFastEnv and C2GMacroEnv at construction time via yaml.safe_load().
#
# Structure
# ---------
#   global      — physics constants and data paths (rarely changed)
#   reward      — reward function weights (shared across all scenarios)
#   market      — ISO grid-market and weather calibration presets
#   default     — baseline training scenario
#   scenario_a  — GenAI Crisis stress scenario
#   scenario_b  — Thermal Squeeze stress scenario
#   scenario_c  — Battery Drain stress scenario
#
# Adding a new scenario
# ---------------------
#   1. Add a new top-level key (e.g. ``my_scenario``) with the fields below.
#   2. Add a matching ``conf/scenario/my_scenario.yaml`` for Hydra composition.
#   3. Register the env_id in the Gymnasium registry if needed.
# ==============================================================================

# ------------------------------------------------------------------------------
# Global physics and data-path constants
# (Override via Hydra: ``+global.dt_seconds=5``)
# ------------------------------------------------------------------------------
global:
  dt_seconds: 5              # Simulation timestep [s]. Must divide 3600 evenly.
  episode_ticks: 17280       # 17280 × 5 s = 24-hour episodes

  # Silicon thermal limit [°C]. Single source of truth for T_safe across the
  # environment, baselines, safety filters, and evaluation. Used as the
  # episode-termination threshold, the reward-headroom denominator, and the
  # observation normalisation scale (temp_*_norm = T / T_safe).
  T_safe: 35.0

  # Data directories (relative to cwd or absolute)
  trace_dir:    "data/processed/workload_traces"
  energy_dir:   "data/processed/energy"
  weather_dir:  "data/processed/weather"

  # Default market (overridden per scenario or via Hydra sweep)
  grid_market:  "nyiso_nyc"  # key into macro_grid.MARKET_PRESETS
  nyiso_zone:   "NYC"        # fallback zone for energy CSV (legacy compat)

# ------------------------------------------------------------------------------
# Reward function weights  (shared across all scenarios)
# ------------------------------------------------------------------------------
reward:
  alpha:         1.0   # Throughput: reward per unit of batch workload served
  beta:          2.0   # Grid tracking: penalty per normalised tracking error
  tracking_floor_fraction: 0.0004
  macro_tracking_floor_fraction: 0.000004
  gamma_thermal: 5.0   # Thermal: penalty per °C above T_warn per tick
  T_warn_A:     33.0   # Zone A warning threshold [°C]  (2°C below T_safe=35)
  T_warn_B:     33.0   # Zone B warning threshold [°C]
  soc_penalty:   0.5   # BESS: penalty per tick when SOC < SOC_min + 2%
  delta_freq_penalty: 2.0   # Frequency: penalty per Hz deviation beyond ±0.2 Hz dead-band
  delta_volt_penalty: 5.0   # Voltage: penalty per pu deviation outside [0.95, 1.05] pu
  sla_backlog_penalty: 2.0  # SLA: penalty per unit of normalised batch backlog

# ------------------------------------------------------------------------------
# Market handshake parameters
# Configures the 3-phase bid/accept protocol between grid and datacenter.
# ------------------------------------------------------------------------------
handshake:
  rmcp_max: 100.0          # max RMCP for price normalisation ($/MWh)
  sigmoid_k_p: 0.15        # bid acceptance sigmoid temperature
  lambda_rev: 1.0           # regulation revenue reward weight
  lambda_elec: 0.5          # electricity cost penalty weight
  lambda_churn: 0.05        # bid MW churn penalty weight

# ------------------------------------------------------------------------------
# Market presets — grid signal + weather parameters per region
# Each market key matches MARKET_PRESETS in macro_grid.py and
# WEATHER_PRESETS in weather.py.
# Overriding a scenario's ``grid_market`` automatically selects the
# matching weather calibration unless ``weather_market`` is set separately.
# ------------------------------------------------------------------------------
markets:
  nyiso_nyc:
    description: "NYISO New York City — baseline, real load + weather data"
    grid_market:    nyiso_nyc
    weather_market: nyiso_nyc
    lmp_currency:   USD
    regulation_product: "AGC Secondary Reserve"

  pjm_dom:
    description: "PJM Northern Virginia (Ashburn) — Data Center Alley"
    grid_market:    pjm_dom
    weather_market: pjm_dom
    lmp_currency:   USD
    regulation_product: "RegD (Fast-Response Regulation)"

  caiso_pgae:
    description: "CAISO Bay Area (San Jose) — duck curve solar"
    grid_market:    caiso_pgae
    weather_market: caiso_pgae
    lmp_currency:   USD
    regulation_product: "REGU / REGD"

  ercot_north:
    description: "ERCOT Dallas–Fort Worth — isolated grid, extreme events"
    grid_market:    ercot_north
    weather_market: ercot_north
    lmp_currency:   USD
    regulation_product: "ECRS (Electricity Contingency Reserve)"

  entso_de:
    description: "ENTSO-E Germany (Frankfurt) — 30-min FCR-N settlement"
    grid_market:    entso_de
    weather_market: entso_de
    lmp_currency:   EUR   # converted to USD in simulator (×1.10)
    regulation_product: "FCR-N (Frequency Containment Reserve — Normal)"

  aemo_nsw:
    description: "AEMO New South Wales (Sydney) — 5-min FCAS dispatch"
    grid_market:    aemo_nsw
    weather_market: aemo_nsw
    lmp_currency:   AUD   # converted to USD in simulator (×0.67)
    regulation_product: "Regulation FCAS"

# ------------------------------------------------------------------------------
# Scenario: default  — Nominal 250 MW operation (used for training)
# ------------------------------------------------------------------------------
# Weather is driven from real NOAA data (weather_driven: true).
# T_amb is the initial/fallback value only; overridden at each tick by
# WeatherLoader when weather_driven is true.
# ------------------------------------------------------------------------------
default:
  name: "Default"
  description: "Nominal summer operation, moderate grid regulation commitment."
  grid_market:    nyiso_nyc
  weather_market: nyiso_nyc  # can be set independently of grid_market
  weather_driven: true       # true → WeatherLoader updates T_amb each tick
                             # false → static T_amb (reproducible stress tests)
  T_amb: 25.0                # Initial / fallback ambient temperature [°C]
  committed_mw_max: 30.0     # Maximum regulation capacity the macro agent may bid [MW]
  bess_soc_init: 0.50        # BESS initial state of charge
  cooling_fault: false
  genai_spike_scale: 1.0     # Multiplier on GenAI spike magnitude
  grid_stress_scale: 1.0     # Multiplier on RegD signal amplitude
  dr_baseline_mw: 5.0        # Standing DR contract capacity [MW]
  dr_rate_usd_mw: 5.0        # DR compensation rate [$/MW·h]

# ------------------------------------------------------------------------------
# Scenario A — The GenAI Crisis
# ------------------------------------------------------------------------------
# A massive v2026 GenAI inference surge occurs simultaneously with a grid
# regulation signal demanding the datacenter REDUCE power output.
# Uses PJM DOM market to stress the combined DVFS + BESS lever synergy in the
# world's largest DC cluster (Ashburn VA).
# Weather is static (weather_driven: false) to ensure reproducible evaluation.
# ------------------------------------------------------------------------------
scenario_a:
  name: "GenAI Crisis"
  description: >
    Simultaneous GenAI inference burst and grid regulation demand-response
    signal. Tests the DVFS + BESS lever synergy under PJM RegD.
  grid_market:    pjm_dom
  weather_market: pjm_dom
  weather_driven: false      # static T_amb for reproducibility
  T_amb: 30.0                # Hot summer day in Northern VA
  committed_mw_max: 40.0
  bess_soc_init: 0.55
  cooling_fault: false
  genai_spike_scale: 1.8     # 80% larger GenAI spikes
  grid_stress_scale: 1.5     # 50% stronger regulation signal
  dr_baseline_mw: 5.0        # Standing DR contract capacity [MW]
  dr_rate_usd_mw: 5.0        # DR compensation rate [$/MW·h]

# ------------------------------------------------------------------------------
# Scenario B — The Thermal Squeeze
# ------------------------------------------------------------------------------
# Extreme summer heat wave degrades CRAH COP. The grid demands maximum
# frequency regulation. Tests thermal inertia exploitation (pump lever).
# ERCOT market: isolated grid → more volatile regulation + extreme prices.
# ------------------------------------------------------------------------------
scenario_b:
  name: "Thermal Squeeze"
  description: >
    40°C ambient severely degrades CRAH COP. ERCOT committed 30 MW.
    Tests CDU pump speed lever and thermal battery strategy.
  grid_market:    ercot_north
  weather_market: ercot_north
  weather_driven: false      # deterministic heat wave
  T_amb: 40.0                # DFW peak summer; COP degrades ~30%
  committed_mw_max: 60.0
  bess_soc_init: 0.60
  cooling_fault: false
  genai_spike_scale: 1.0
  grid_stress_scale: 1.3
  dr_baseline_mw: 5.0        # Standing DR contract capacity [MW]
  dr_rate_usd_mw: 5.0        # DR compensation rate [$/MW·h]

# ------------------------------------------------------------------------------
# Scenario C — The Battery Drain
# ------------------------------------------------------------------------------
# A sustained grid anomaly drains BESS near 10% SOC.
# Cooling pump fault is also active (40% efficiency loss).
# AEMO NSW: 5-minute dispatch window → tightest energy-neutrality constraint.
# ------------------------------------------------------------------------------
scenario_c:
  name: "Battery Drain"
  description: >
    Prolonged regulation discharge drains BESS to near SOC_min (10%).
    Cooling pump fault + AEMO 5-min dispatch. Tests DVFS-only resilience.
  grid_market:    aemo_nsw
  weather_market: aemo_nsw
  weather_driven: false      # deterministic low-battery + fault scenario
  T_amb: 32.0                # Western Sydney summer afternoon
  committed_mw_max: 40.0
  bess_soc_init: 0.15        # Start near empty
  cooling_fault: true
  cooling_fault_factor: 0.6  # 40% pump efficiency loss
  genai_spike_scale: 1.2
  grid_stress_scale: 1.2
  dr_baseline_mw: 5.0        # Standing DR contract capacity [MW]
  dr_rate_usd_mw: 5.0        # DR compensation rate [$/MW·h]

# ------------------------------------------------------------------------------
# Capacity-generalization plants (50 / 100 / 500 MW)
# ------------------------------------------------------------------------------
# Defined as a separate Hydra config group under conf/plant_profiles/ and
# injected at runtime as ``plant_overrides`` (env kwarg), so they compose with
# any scenario/market rather than duplicating scenario fields here. See
# conf/plant_profiles/*.yaml. Standalone (non-Hydra) callers can pass the same
# dict directly: ``C2GFastEnv(plant_overrides={...})``.
# ------------------------------------------------------------------------------
