name: rule_macro_ppo

# Training length & parallelism
timesteps: 30_000_000
n_envs: 16
eval_freq: 10_000
n_eval_episodes: 5

# SB3 PPO hyperparameters (same as ppo.yaml, low-level controller)
learning_rate: 3.0e-5
n_steps: 8
batch_size: 64
n_epochs: 2
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5
net_arch:
  pi: [256, 256]
  vf: [256, 256]

# VecNormalize
norm_obs: true
norm_reward: true
clip_obs: 10.0
clip_reward: 10.0

# Fixed actions: pin specific action dimensions to constant values.
# Keys are action indices (0=throttle, 1=pump, 2=hvac, 3=bess), values are fixed outputs.
# Example: {1: 1.0, 2: 0.7} fixes cooling, agent learns throttle+BESS only.
fixed_actions: null

# Resume from checkpoint (path to .zip without extension, null = train from scratch)
resume_from: null
resume_vecnorm: null     # path to vec_normalize.pkl (optional, auto-detected if null)
