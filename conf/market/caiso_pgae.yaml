# @package _global_
# Market preset: caiso_pgae
# CAISO Bay Area — duck curve solar
# Overrides grid_market and weather_market for any scenario.
# Usage:  python train_ppo.py market=caiso_pgae
# Sweep:  python train_ppo.py --multirun market=nyiso_nyc,pjm_dom,caiso_pgae,ercot_north,entso_de,aemo_nsw
market:
  id: caiso_pgae
  description: "CAISO Bay Area — duck curve solar"

# These are written into the env config at runtime
env_overrides:
  grid_market: caiso_pgae
  weather_market: caiso_pgae
