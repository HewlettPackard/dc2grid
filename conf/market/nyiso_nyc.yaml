# @package _global_
# Market preset: nyiso_nyc
# NYISO New York City (Real load + weather data)
# Overrides grid_market and weather_market for any scenario.
# Usage:  python train_ppo.py market=nyiso_nyc
# Sweep:  python train_ppo.py --multirun market=nyiso_nyc,pjm_dom,caiso_pgae,ercot_north,entso_de,aemo_nsw
market:
  id: nyiso_nyc
  description: "NYISO New York City (Real load + weather data)"

# These are written into the env config at runtime
env_overrides:
  grid_market: nyiso_nyc
  weather_market: nyiso_nyc
