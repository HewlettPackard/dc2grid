# conf/plant_profiles/plant_50mw.yaml
# Plant capacity profile — 50 MW facility (0.2x the 250 MW default).
# Canonical Hydra-side definition of the plant sizing used by the
# capacity-generalization experiments. Mirrors c2g_env/config.yaml
# [plant_50mw] (the runtime source the env reads via scenario name).
#
# Nameplate = (n_racks_a_flex + n_racks_a_base) x 75 kW + n_racks_b x 40 kW
#           = 400 x 75 kW (30 MW, Zone A) + 500 x 40 kW (20 MW, Zone B).
#
# Extensive quantities scale linearly with capacity; intensive quantities
# (per-rack power, COP, C/K time constant, SOC bounds, setpoints) are unchanged.
name: plant_50mw
description: "50 MW facility (0.2x default) — capacity-generalization test"

plant:
  # Capacity-scaled standing DR commitment (0.2x default)
  dr_baseline_mw:   1.0
  n_racks_a_flex: 240
  n_racks_a_base: 160
  n_racks_b:      500
  S_xfmr_mva:     60.0
  p_iron_mw:      0.03
  p_lighting_mw:  0.1
  p_network_mw:   0.3
  C_A:            5400.0
  C_B:            2000.0
  K_liq:          7.0
  K_air:          2.6
  K_env_A:        0.1
  K_env_B:        0.1
  max_hvac_mw:    10.0
  P_PUMP_MAX_MW:  0.3
  E_NOM_MWH:      3.0
  P_MAX_MW:       1.0
