[project]
name = "c2g-macro"
version = "0.1.0"
description = "Hierarchical AI Orchestration for Grid-Interactive Hyperscale Data Centers — NeurIPS 2026 Benchmark"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    # Phase 1 — Physics engines
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyyaml>=6.0",
    # Phase 2 — RL environment
    "gymnasium>=1.0",
    # Phase 3 — PyTorch (CUDA 12.4 wheels; binary-compatible with CUDA 12.5 driver 555.x)
    "torch>=2.6",
    "torchvision>=0.21",
    "torchaudio>=2.6",
    # Phase 4 — Baseline agents
    "stable-baselines3>=2.3",
    "tensorboard>=2.17",
    "hydra-core>=1.3",
    # Phase 5 — Evolutionary & optimization baselines
    "cma>=4.0",
    "pymoo>=0.6",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.8",
    "tqdm>=4.67.3",
    "openai>=1.0",
    "tiktoken>=0.12.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0",
]
serve = [
    # vLLM inference server (from PyPI) — CUDA 12.x runtime compatible.
    # Linux-only: vLLM ships no Windows wheels.
    # Install with: uv sync --extra serve
    "vllm>=0.8.0; sys_platform == 'linux'",
    # transformers: >=4.48 for Qwen2 tokenizer fix; <5.0 because transformers 5.x
    # removed all_special_tokens_extended which vLLM still calls.
    "transformers>=4.48.0,<5.0",
]
pysam = [
    # Must install separately; binaries are platform-specific.
    # See: https://nrel-pysam.readthedocs.io/
    "nrel-pysam>=5.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:CUDA initialization:UserWarning",
]
markers = [
    "smoke: end-to-end CLI smoke tests that spawn real subprocesses (run with: pytest -m smoke)",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["c2g_env", "preprocessing"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu",   marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu",   marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu",   marker = "sys_platform == 'win32'" },
]

[tool.uv]
# Resolve for both Linux (CUDA) and Windows (CPU) platforms.
# vLLM and flashinfer ship no Windows wheels; they are gated with sys_platform markers.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
